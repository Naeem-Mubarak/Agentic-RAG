[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naeem Mubarak", email = "naeemmubarak777@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.3",
    "langchain[mcp]>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "numpy>=2.5.2",
    "pypdf>=6.18.0",
    "pymupdf>=1.28.2",
    "google-genai>=2.22.0",
    "langchain-huggingface>=1.2.2",
    "huggingface-hub>=1.31.0",
    "accelerate>=1.15.0",
    "psycopg2-binary>=2.9.13",
    "langchain-tavily>=0.2.18",
    "pandas>=3.0.5",
    "langchain-groq>=1.1.3",
    "tavily-python>=0.8.4",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "websockets>=16.1.1",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
