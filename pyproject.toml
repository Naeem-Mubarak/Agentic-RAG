[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naeem Mubarak", email = "naeemmubarak777@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.3",
    "langchain[mcp]>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "numpy>=2.5.2",
    "pypdf>=6.18.0",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
